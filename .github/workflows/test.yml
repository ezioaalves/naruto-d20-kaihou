name: Test

# Lint + full test suite on every push and PR.
# pytest's vault-dependent test (test_skill_mapping.py) self-skips when the
# Kaihou vault is absent, so this runs cleanly on GitHub-hosted runners.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          pip install pytest pyyaml

      - name: Lint
        run: npm run lint

      - name: Test (pytest + vitest + CSS freshness)
        run: npm test
